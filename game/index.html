<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Silent Tower</title>
    <meta name="author" content="Azul Nuarte">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="icon" type="image/png" href="images/favicon.ico">
</head>
<body>

    <main class="game">

        <img id="scene-image" src="images/logo.png" alt="Scene">
    
        <section class="story">
    
            <h1 id="scene-title">
                The Silent Tower
            </h1>
    
            <p id="scene-text">
                No one remembers what happened. No one knows where they went. Will you uncover the truth hidden within the Silent Tower?

            </p>
    
        </section>
    
        <section id="choices" class="choices">
    
            <button onclick="loadScene('start')">
                Start Game
            </button>
    
        </section>
    
    </main>

<script src="scripts/game.js"></script>
</body>
</html>
